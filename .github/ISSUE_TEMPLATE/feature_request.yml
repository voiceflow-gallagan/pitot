name: Feature request
description: Suggest an idea for Pitot.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposed behavior
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Which setting or file, if any
  - type: input
    id: docs-link
    attributes:
      label: Link to the Claude Code documentation
      description: Only settings that the official docs describe can become toggles. If your idea is about a new setting, link the docs page for it.
